<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pride Connect</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  background:#f7f7fb;
  color:#171827;
  font-family:Arial,sans-serif
}
button,input,textarea{font:inherit}
.app{
  max-width:430px;
  min-height:100vh;
  margin:auto;
  background:#fafafd
}
.hide{display:none!important}

.top{
  height:68px;
  background:#fff;
  border-bottom:1px solid #ddd;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 10px;
  position:sticky;
  top:0;
  z-index:20
}

.logo{
  font-size:21px;
  font-weight:800;
  background:linear-gradient(90deg,#ef1680,#6420dc);
  color:transparent;
  background-clip:text
}

.icons{
  display:flex;
  gap:5px
}

.icon,.nav,.more{
  border:0;
  background:#fff;
  cursor:pointer
}

.icon{
  width:43px;
  height:42px;
  border-radius:11px;
  background:#f5f5f8;
  font-size:20px
}

.screen{
  display:none;
  min-height:calc(100vh - 136px);
  padding:10px 10px 90px
}

.screen.active{display:block}

.card{
  background:#fff;
  border:1px solid #e8e8ef;
  border-radius:15px;
  box-shadow:0 2px 8px #0000000a
}

.composer{
  padding:12px;
  display:flex;
  gap:10px
}

.avatar{
  width:52px;
  height:52px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd
}

.compose{
  flex:1;
  border:2px solid #e7e7ed;
  border-radius:11px;
  padding:12px
}

.hint{
  color:#65697a;
  font-size:17px;
  margin-bottom:12px
}

.compose textarea{
  width:100%;
  border:0;
  outline:0;
  resize:none;
  min-height:45px
}

.tools{
  display:flex;
  align-items:center;
  gap:10px
}

.tools button{
  border:0;
  background:none;
  font-size:22px;
  cursor:pointer
}

.post{
  margin-left:auto;
  background:#5d13dc!important;
  color:#fff;
  border-radius:9px!important;
  padding:9px 18px;
  font-weight:700
}

.feed{
  margin-top:10px
}

.feed .card{
  padding:14px;
  margin-bottom:10px
}

.head{
  display:flex;
  align-items:center;
  gap:10px
}

.name{
  font-size:18px;
  font-weight:800
}

.time{
  color:#666;
  font-size:13px;
  margin-top:4px
}

.more{
  margin-left:auto;
  font-size:25px;
  background:transparent
}

.msg{
  font-size:17px;
  line-height:1.45;
  margin:20px 0
}

.post-photo{
  width:100%;
  max-height:430px;
  object-fit:cover;
  border-radius:12px;
  margin-top:8px
}

.actions{
  border-top:1px solid #eee;
  padding-top:10px;
  display:grid;
  grid-template-columns:repeat(3,1fr)
}

.actions button{
  border:0;
  background:none;
  min-height:42px;
  cursor:pointer
}

.nice.liked{
  color:#6420dc;
  font-weight:700
}

.empty{
  text-align:center;
  padding:35px 15px;
  color:#686b7b
}

.hero{
  padding:18px;
  margin-bottom:10px;
  background:linear-gradient(135deg,#5d13dc,#8e21e8);
  color:#fff;
  border-radius:15px
}

.big{
  width:100%;
  height:48px;
  border:0;
  border-radius:10px;
  background:#5d13dc;
  color:#fff;
  font-weight:700;
  cursor:pointer
}

.profile-banner{
  height:72px;
  background:linear-gradient(110deg,#4d00e8,#9400e3,#ff7900);
  border-radius:15px 15px 0 0
}

.profile-body{
  padding:18px
}

.phead{
  display:flex;
  gap:14px
}

.profile-wrap{
  position:relative
}

.profile-wrap .avatar{
  width:82px;
  height:82px
}

.camera{
  position:absolute;
  right:-3px;
  bottom:-3px;
  width:31px;
  height:31px;
  border-radius:50%;
  background:#6420dc;
  color:#fff;
  border:3px solid #fff;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer
}

.upload{
  width:100%;
  height:50px;
  margin-top:17px;
  border:2px solid #6c18df;
  background:#fff;
  color:#5c13d6;
  border-radius:9px;
  font-weight:bold;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer
}

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:68px;
  background:#fff;
  border-top:1px solid #ddd;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  z-index:30;
  max-width:430px;
  margin:auto
}

.nav{
  font-size:11px;
  color:#151722;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  cursor:pointer
}

.nav b{
  font-size:23px;
  line-height:24px
}

.nav.active{
  color:#5d12d8
}

.auth{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:linear-gradient(135deg,#faf0ff,#fff)
}

.authbox{
  width:100%;
  max-width:390px;
  background:#fff;
  padding:24px;
  border-radius:20px;
  box-shadow:0 8px 30px #0001
}

.authbox h1{
  margin-top:0
}

.authbox input{
  width:100%;
  height:50px;
  margin:7px 0;
  padding:0 14px;
  border:1px solid #ddd;
  border-radius:10px
}

.primary,.secondary{
  width:100%;
  height:50px;
  margin-top:10px;
  border-radius:10px;
  font-weight:700;
  cursor:pointer
}

.primary{
  border:0;
  background:#6415df;
  color:#fff
}

.secondary{
  border:2px solid #6415df;
  background:#fff;
  color:#6415df
}

.msgbox{
  min-height:20px;
  color:#c33;
  font-size:13px;
  margin:6px 0
}

.toast{
  position:fixed;
  left:50%;
  bottom:88px;
  transform:translate(-50%,10px);
  background:#222;
  color:#fff;
  padding:11px 15px;
  border-radius:9px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  z-index:50;
  max-width:90%;
  text-align:center
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0)
}

.photo-preview{
  position:relative;
  margin-top:10px
}

.photo-preview img{
  width:100%;
  max-height:220px;
  object-fit:cover;
  border-radius:10px
}

.remove-photo{
  position:absolute;
  right:7px;
  top:7px;
  width:34px;
  height:34px;
  border:0;
  border-radius:50%;
  background:#222c;
  color:#fff;
  font-size:18px;
  cursor:pointer
}
</style>
</head>

<body>

<div id="toast" class="toast"></div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
'https://uupofonanisdjmmawlml.supabase.co';

const SUPABASE_PUBLISHABLE_KEY =
'sb_publishable_DpZ1Fzh9A6GjblSnRHrAPw__OFGaML_';


/*
 IMPORTANT:
 persistSession:true
 para hindi automatic logout kapag nag-refresh.
*/

const db =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  }
);


const FALLBACK =
'https://placehold.co/160x160/png?text=YU';


let toastTimer;
let selectedPhoto = null;


/* =========================================================
   TOAST
========================================================= */

function toast(message){

  const e =
    document.getElementById('toast');

  e.textContent = message;

  e.classList.add('show');

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(()=>{
      e.classList.remove('show');
    },1700);
}


/* =========================================================
   NAVIGATION
========================================================= */

function openScreen(id,btn){

  document
    .querySelectorAll('.screen')
    .forEach(x =>
      x.classList.remove('active')
    );

  const screen =
    document.getElementById(id);

  if(screen){
    screen.classList.add('active');
  }

  document
    .querySelectorAll('.nav')
    .forEach(x =>
      x.classList.remove('active')
    );

  if(btn){
    btn.classList.add('active');
  }

  window.scrollTo(0,0);
}


/* =========================================================
   AVATAR
========================================================= */

function setAvatars(url){

  const finalUrl =
    url || FALLBACK;

  [
    'homeAvatar',
    'profileImage'
  ].forEach(id=>{

    const e =
      document.getElementById(id);

    if(e){
      e.src = finalUrl;
    }

  });
}


/* =========================================================
   CURRENT USER
========================================================= */

async function currentUser(){

  const result =
    await db.auth.getUser();

  return result.data.user || null;
}


/* =========================================================
   LOAD PROFILE
========================================================= */

async function loadProfile(){

  const u =
    await currentUser();

  if(!u) return;


  let result =
    await db
      .from('profiles')
      .select(
        'display_name,username,avatar_url'
      )
      .eq('id',u.id)
      .maybeSingle();


  let data =
    result.data;


  if(!data){

    const name =
      u.user_metadata?.display_name ||
      u.email?.split('@')[0] ||
      'User';

    const username =
      (
        'u' +
        u.id
          .replace(/-/g,'')
          .slice(0,10)
      ).toLowerCase();


    await db
      .from('profiles')
      .insert({
        id:u.id,
        display_name:name,
        username:username
      });


    data = {
      display_name:name,
      username:username,
      avatar_url:null
    };

  }


  document
    .getElementById('profileName')
    .textContent =
      data.display_name || 'User';


  document
    .getElementById('profileUsername')
    .textContent =
      '@' +
      (data.username || 'user');


  setAvatars(
    data.avatar_url || FALLBACK
  );


  await loadFeed();
}


/* =========================================================
   SAFE HTML
========================================================= */

function esc(s){

  return String(s ?? '')
    .replace(
      /[&<>'"]/g,
      c=>({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        "'":'&#39;',
        '"':'&quot;'
      }[c])
    );
}


/* =========================================================
   POST DATA COMPATIBILITY
========================================================= */

/*
 Old posts:
 "Hello world"

 New posts:
 JSON:
 {
   text:"Hello",
   image_url:"..."
 }

 Kaya hindi masisira ang old posts.
*/

function parsePostBody(body){

  try{

    const parsed =
      JSON.parse(body);

    if(
      parsed &&
      typeof parsed === 'object'
    ){

      return {
        text:parsed.text || '',
        image_url:parsed.image_url || ''
      };

    }

  }catch(e){}

  return {
    text:body || '',
    image_url:''
  };
}


/* =========================================================
   LOAD FEED
========================================================= */

async function loadFeed(){

  const u =
    await currentUser();

  if(!u) return;


  const box =
    document.getElementById('feed');


  const r =
    await db
      .from('posts')
      .select(
        'id,body,created_at'
      )
      .eq(
        'user_id',
        u.id
      )
      .order(
        'created_at',
        {ascending:false}
      )
      .limit(30);


  if(
    r.error ||
    !r.data ||
    !r.data.length
  ){

    box.innerHTML =
      `
      <div class="empty card">
        Wala ka pang post. ✨
        <br>
        Gumawa ng first post mo sa taas.
      </div>
      `;

    return;
  }


  const avatar =
    document
      .getElementById('homeAvatar')
      .src;


  const name =
    document
      .getElementById('profileName')
      .textContent;


  box.innerHTML =
    r.data.map(p=>{

      const post =
        parsePostBody(p.body);


      const photo =
        post.image_url
          ?
          `
          <img
            class="post-photo"
            src="${esc(post.image_url)}"
            loading="lazy"
          >
          `
          :
          '';


      const text =
        post.text
          ?
          `
          <div class="msg">
            ${esc(post.text)}
          </div>
          `
          :
          '';


      const time =
        new Date(p.created_at)
          .toLocaleString();


      return `
        <article class="card">

          <div class="head">

            <img
              class="avatar"
              src="${esc(avatar)}"
            >

            <div>

              <div class="name">
                ${esc(name)} 🌈
              </div>

              <div class="time">
                ${esc(time)} · 🌐
              </div>

            </div>

            <button class="more"
                    onclick="toast('Post menu')">
              ⋮
            </button>

          </div>

          ${text}

          ${photo}

          <div class="actions">

            <button
              onclick="like(this)">
              ☘ Nice
            </button>

            <button
              onclick="toast('Comments coming next')">
              💬 Comment
            </button>

            <button
              onclick="toast('Share coming next')">
              ↗ Share
            </button>

          </div>

        </article>
      `;

    }).join('');
}


/* =========================================================
   SELECT PHOTO
========================================================= */

document
  .getElementById('postPhoto')
  .addEventListener(
    'change',
    function(e){

      const file =
        e.target.files?.[0];

      if(!file) return;


      if(
        !file.type.startsWith('image/')
      ){

        toast('Please select an image.');

        e.target.value='';

        return;
      }


      if(
        file.size >
        5 * 1024 * 1024
      ){

        toast(
          'Image must be under 5MB.'
        );

        e.target.value='';

        return;
      }


      selectedPhoto =
        file;


      const reader =
        new FileReader();


      reader.onload =
        function(event){

          document
            .getElementById('previewImage')
            .src =
              event.target.result;


          document
            .getElementById('photoPreview')
            .classList
            .remove('hide');

        };


      reader.readAsDataURL(file);

      toast('Photo added');

    }
  );


/* =========================================================
   REMOVE SELECTED PHOTO
========================================================= */

function removeSelectedPhoto(){

  selectedPhoto = null;

  document
    .getElementById('postPhoto')
    .value = '';


  document
    .getElementById('photoPreview')
    .classList
    .add('hide');


  document
    .getElementById('previewImage')
    .src = '';
}


/* =========================================================
   UPLOAD POST PHOTO
========================================================= */

async function uploadPostPhoto(file,user){

  if(!file) return null;


  const ext =
    (
      file.name
        .split('.')
        .pop() ||
      'jpg'
    )
    .toLowerCase()
    .replace(
      /[^a-z0-9]/g,
      ''
    );


  /*
   Existing "avatars" bucket ang ginagamit natin
   para hindi na kailangan gumawa ng bagong bucket.
  */

  const path =
    `${user.id}/posts/post-${Date.now()}.${ext}`;


  const upload =
    await db
      .storage
      .from('avatars')
      .upload(
        path,
        file,
        {
          contentType:file.type,
          upsert:false,
          cacheControl:'3600'
        }
      );


  if(upload.error){

    throw upload.error;

  }


  const publicUrl =
    db
      .storage
      .from('avatars')
