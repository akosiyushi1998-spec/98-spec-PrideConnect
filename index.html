<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pride Connect</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  background:#f7f7fb;
  color:#171827;
  font-family:Arial,sans-serif
}
button,input,textarea{font:inherit}
.app{
  max-width:430px;
  min-height:100vh;
  margin:auto;
  background:#fafafd
}
.hide{display:none!important}

.top{
  height:68px;
  background:#fff;
  border-bottom:1px solid #ddd;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 10px;
  position:sticky;
  top:0;
  z-index:20
}
.logo{
  font-size:21px;
  font-weight:800;
  background:linear-gradient(90deg,#ef1680,#6420dc);
  color:transparent;
  background-clip:text
}
.icons{display:flex;gap:5px}
.icon,.nav,.more{
  border:0;
  background:#fff;
  cursor:pointer
}
.icon{
  width:43px;
  height:42px;
  border-radius:11px;
  background:#f5f5f8;
  font-size:20px
}

.screen{
  display:none;
  min-height:calc(100vh - 136px);
  padding:10px 10px 90px
}
.screen.active{display:block}

.card{
  background:#fff;
  border:1px solid #e8e8ef;
  border-radius:15px;
  box-shadow:0 2px 8px #0000000a
}

.composer{
  padding:12px;
  display:flex;
  gap:10px
}

.avatar{
  width:52px;
  height:52px;
  border-radius:50%;
  object-fit:cover;
  background:#ddd
}

.compose{
  flex:1;
  border:2px solid #e7e7ed;
  border-radius:11px;
  padding:12px
}

.hint{
  color:#65697a;
  font-size:17px;
  margin-bottom:12px
}

.compose textarea{
  width:100%;
  border:0;
  outline:0;
  resize:none;
  min-height:45px
}

.tools{
  display:flex;
  align-items:center;
  gap:10px
}

.tools button{
  border:0;
  background:none;
  font-size:22px;
  cursor:pointer
}

.post{
  margin-left:auto;
  background:#5d13dc!important;
  color:#fff;
  border-radius:9px!important;
  padding:9px 18px;
  font-weight:700
}

.photo-preview{
  position:relative;
  margin:8px 0 12px;
  display:none
}

.photo-preview.show{display:block}

.photo-preview img{
  width:100%;
  max-height:280px;
  object-fit:cover;
  border-radius:12px;
  border:1px solid #ddd
}

.remove-photo{
  position:absolute;
  right:8px;
  top:8px;
  width:34px;
  height:34px;
  border:0;
  border-radius:50%;
  background:#000b;
  color:#fff;
  font-size:20px;
  cursor:pointer
}

.feed{margin-top:10px}

.feed .card{
  padding:14px;
  margin-bottom:10px
}

.head{
  display:flex;
  align-items:center;
  gap:10px
}

.name{
  font-size:18px;
  font-weight:800
}

.time{
  color:#666;
  font-size:13px;
  margin-top:4px
}

.more{
  margin-left:auto;
  font-size:25px;
  background:transparent
}

.msg{
  font-size:17px;
  line-height:1.45;
  margin:20px 0
}

.post-photo{
  width:100%;
  max-height:420px;
  object-fit:cover;
  border-radius:12px;
  margin:4px 0 15px;
  display:block
}

.actions{
  border-top:1px solid #eee;
  padding-top:10px;
  display:grid;
  grid-template-columns:repeat(3,1fr)
}

.actions button{
  border:0;
  background:none;
  min-height:42px;
  cursor:pointer
}

.nice.liked{
  color:#6420dc;
  font-weight:700
}

.empty{
  text-align:center;
  padding:35px 15px;
  color:#686b7b
}

.hero{
  padding:18px;
  margin-bottom:10px;
  background:linear-gradient(135deg,#5d13dc,#8e21e8);
  color:#fff;
  border-radius:15px
}

.big{
  width:100%;
  height:48px;
  border:0;
  border-radius:10px;
  background:#5d13dc;
  color:#fff;
  font-weight:700;
  cursor:pointer
}

.profile-banner{
  height:72px;
  background:linear-gradient(110deg,#4d00e8,#9400e3,#ff7900);
  border-radius:15px 15px 0 0
}

.profile-body{padding:18px}

.phead{
  display:flex;
  gap:14px
}

.profile-wrap{position:relative}

.profile-wrap .avatar{
  width:82px;
  height:82px
}

.camera{
  position:absolute;
  right:-3px;
  bottom:-3px;
  width:31px;
  height:31px;
  border-radius:50%;
  background:#6420dc;
  color:#fff;
  border:3px solid #fff;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer
}

.upload{
  width:100%;
  height:50px;
  margin-top:17px;
  border:2px solid #6c18df;
  background:#fff;
  color:#5c13d6;
  border-radius:9px;
  font-weight:bold;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer
}

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:68px;
  background:#fff;
  border-top:1px solid #ddd;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  z-index:30;
  max-width:430px;
  margin:auto
}

.nav{
  font-size:11px;
  color:#151722;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  cursor:pointer
}

.nav b{
  font-size:23px;
  line-height:24px
}

.nav.active{color:#5d12d8}

.auth{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:linear-gradient(135deg,#faf0ff,#fff)
}

.authbox{
  width:100%;
  max-width:390px;
  background:#fff;
  padding:24px;
  border-radius:20px;
  box-shadow:0 8px 30px #0001
}

.authbox h1{margin-top:0}

.authbox input{
  width:100%;
  height:50px;
  margin:7px 0;
  padding:0 14px;
  border:1px solid #ddd;
  border-radius:10px
}

.primary,.secondary{
  width:100%;
  height:50px;
  margin-top:10px;
  border-radius:10px;
  font-weight:700;
  cursor:pointer
}

.primary{
  border:0;
  background:#6415df;
  color:#fff
}

.secondary{
  border:2px solid #6415df;
  background:#fff;
  color:#6415df
}

.msgbox{
  min-height:20px;
  color:#c33;
  font-size:13px;
  margin:6px 0
}

.toast{
  position:fixed;
  left:50%;
  bottom:88px;
  transform:translate(-50%,10px);
  background:#222;
  color:#fff;
  padding:11px 15px;
  border-radius:9px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  z-index:50
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0)
}
</style>
</head>

<body>

<div id="auth" class="auth">
  <div class="authbox">
    <h1>🌈 <span style="color:#6415df">Pride Connect</span></h1>
    <p>Login or create your account.</p>

    <div id="authMsg" class="msgbox"></div>

    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <input id="displayName" placeholder="Display name (for sign up)">

    <button id="login" class="primary">Login</button>
    <button id="signup" class="secondary">Create Account</button>
  </div>
</div>


<div id="app" class="app hide">

<header class="top">
  <div class="logo">🌈 Pride Connect</div>

  <div class="icons">
    <button class="icon" onclick="toast('Notifications')">🔔</button>
    <button class="icon" onclick="openScreen('chat')">💬</button>
    <button class="icon" onclick="openScreen('profile')">👤</button>
  </div>
</header>


<section id="home" class="screen active">

  <div class="card composer">

    <img id="homeAvatar" class="avatar">

    <div class="compose">

      <div class="hint">What's on your mind?</div>

      <textarea
        id="postText"
        placeholder="Write a post..."
      ></textarea>

      <!-- PHOTO PREVIEW -->
      <div id="photoPreview" class="photo-preview">

        <img id="previewImage">

        <button
          class="remove-photo"
          onclick="removePostPhoto()"
          type="button"
        >×</button>

      </div>

      <div class="tools">

        <!-- PHOTO BUTTON -->
        <button
          type="button"
          onclick="document.getElementById('postPhoto').click()"
          title="Add photo"
        >🖼️</button>

        <button
          type="button"
          onclick="toast('Emoji')"
        >😊</button>

        <button
          class="post"
          type="button"
          onclick="publish()"
        >Post</button>

      </div>

      <!-- HIDDEN PHOTO INPUT -->
      <input
        id="postPhoto"
        type="file"
        accept="image/*"
        hidden
      >

    </div>
  </div>

  <div id="feed" class="feed"></div>

</section>


<section id="dating" class="screen">

  <div class="hero">
    <h2>Dating 💜</h2>
    <p>Discover people and make connections.</p>
  </div>

  <div class="card" style="padding:16px">
    <button
      class="big"
      onclick="toast('Dating module ready')"
    >Discover people</button>
  </div>

</section>


<section id="wallet" class="screen">

  <div class="hero">
    <h2>Wallet 💰</h2>
    <p>Your balance</p>
    <h1>₱0.00</h1>
  </div>

</section>


<section id="shop" class="screen">

  <div class="hero">
    <h2>Shop 🛍️</h2>
    <p>Shop module is ready for the next module.</p>
  </div>

</section>


<section id="profile" class="screen">

  <div class="card">

    <div class="profile-banner"></div>

    <div class="profile-body">

      <div class="phead">

        <div class="profile-wrap">

          <img id="profileImage" class="avatar">

          <label
            for="profileUpload"
            class="camera"
          >📷</label>

        </div>

        <div>

          <div
            id="profileName"
            style="font-size:24px;font-weight:800"
          >User</div>

          <div
            id="profileUsername"
            style="color:#5e17da;font-weight:bold"
          >@user</div>

          <div class="meta">
            Pride Connect member 🌈
          </div>

        </div>

      </div>

      <label
        for="profileUpload"
        class="upload"
      >📷 Upload Profile Picture</label>

      <input
        id="profileUpload"
        type="file"
        accept="image/*"
        hidden
      >

      <button
        class="secondary"
        onclick="logout()"
      >Log out</button>

    </div>

  </div>

</section>


<section id="chat" class="screen">

  <div class="hero">
    <h2>Messages 💬</h2>
    <p>No conversations yet.</p>
  </div>

</section>


<nav class="bottom">

  <button
    class="nav active"
    onclick="openScreen('home',this)"
  >
    <b>⌂</b>
    Home
  </button>

  <button
    class="nav"
    onclick="openScreen('dating',this)"
  >
    <b>♥</b>
    Dating
  </button>

  <button
    class="nav"
    onclick="openScreen('wallet',this)"
  >
    <b>▣</b>
    Wallet
  </button>

  <button
    class="nav"
    onclick="openScreen('shop',this)"
  >
    <b>♧</b>
    Shop
  </button>

  <button
    class="nav"
    onclick="openScreen('profile',this)"
  >
    <b>●</b>
    Profile
  </button>

</nav>

</div>

<div id="toast" class="toast"></div>


<script>

const SUPABASE_URL =
'https://uupofonanisdjmmawlml.supabase.co';

const SUPABASE_PUBLISHABLE_KEY =
'sb_publishable_DpZ1Fzh9A6GjblSnRHrAPw__OFGaML_';

const db =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY,
  {
    auth:{
      persistSession:false,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  }
);

const FALLBACK =
'https://placehold.co/160x160/png?text=YU';

let toastTimer;


/* =========================
   TOAST
========================= */

function toast(m){

  const e =
    document.getElementById('toast');

  e.textContent=m;

  e.classList.add('show');

  clearTimeout(toastTimer);

  toastTimer=setTimeout(
    ()=>e.classList.remove('show'),
    1700
  );
}


/* =========================
   NAVIGATION
========================= */

function openScreen(id,btn){

  document
    .querySelectorAll('.screen')
    .forEach(x=>x.classList.remove('active'));

  const screen =
    document.getElementById(id);

  if(screen){
    screen.classList.add('active');
  }

  document
    .querySelectorAll('.nav')
    .forEach(x=>x.classList.remove('active'));

  if(btn){
    btn.classList.add('active');
  }

  window.scrollTo(0,0);
}


/* =========================
   AVATARS
========================= */

function setAvatars(url){

  ['homeAvatar','profileImage']
  .forEach(id=>{

    const e =
      document.getElementById(id);

    if(e){
      e.src=url||FALLBACK;
    }

  });

}


/* =========================
   CURRENT USER
========================= */

async function currentUser(){

  return (
    await db.auth.getUser()
  ).data.user;

}


/* =========================
   PROFILE
========================= */

async function loadProfile(){

  const u =
    await currentUser();

  if(!u)return;

  let {data}=await db
    .from('profiles')
    .select(
      'display_name,username,avatar_url'
    )
    .eq('id',u.id)
    .maybeSingle();

  if(!data){

    const name =
      (
        u.user_metadata?.display_name ||
        u.email?.split('@')[0] ||
        'User'
      );

    const username =
      (
        'u'+
        u.id
          .replace(/-/g,'')
          .slice(0,10)
      ).toLowerCase();

    await db
      .from('profiles')
      .insert({
        id:u.id,
        display_name:name,
        username
      });

    data={
      display_name:name,
      username,
      avatar_url:null
    };

  }

  document
    .getElementById('profileName')
    .textContent =
      data.display_name||'User';

  document
    .getElementById('profileUsername')
    .textContent =
      '@'+(data.username||'user');

  setAvatars(
    data.avatar_url||FALLBACK
  );

  loadFeed();

}


/* =========================
   POST DATA PARSER
========================= */

function parsePostBody(body){

  const marker='[[PC_PHOTO]]';

  if(
    typeof body==='string' &&
    body.startsWith(marker)
  ){

    const rest =
      body.slice(marker.length);

    const firstBreak =
      rest.indexOf('\n');

    if(firstBreak===-1){

      return {
        image:rest.trim(),
        caption:''
      };

    }

    return {
      image:
        rest
          .slice(0,firstBreak)
          .trim(),

      caption:
        rest
          .slice(firstBreak+1)
          .trim()
    };

  }

  return {
    image:null,
    caption:body
  };

}


/* =========================
   LOAD FEED
========================= */

async function loadFeed(){

  const u =
    await currentUser();

  if(!u)return;

  const box =
    document.getElementById('feed');

  const r =
    await db
      .from('posts')
      .select(
        'id,body,created_at'
      )
      .eq('user_id',u.id)
      .order(
        'created_at',
        {ascending:false}
      )
      .limit(30);

  if(
    r.error ||
    !r.data?.length
  ){

    box.innerHTML=
      '<div class="empty card">'+
      'Wala ka pang post. ✨<br>'+
      'Gumawa ng first post mo sa taas.'+
      '</div>';

    return;
  }


  const profileName =
    document
      .getElementById('profileName')
      .textContent;


  box.innerHTML =
    r.data.map(p=>{

      const post =
        parsePostBody(p.body);

      const imageHTML =
        post.image
        ?
        `<img
          class="post-photo"
          src="${esc(post.image)}"
          alt="Post photo"
          loading="lazy"
        >`
        :
        '';


      const captionHTML =
        post.caption
        ?
        `<div class="msg">
          ${esc(post.caption)}
        </div>`
        :
        '';


      const date =
        p.created_at
        ?
        new Date(p.created_at)
        :
        new Date();


      const timeText =
        isNaN(date.getTime())
        ?
        'Just now'
        :
        date.toLocaleString();


      return `

        <article class="card">

          <div class="head">

            <img
              class="avatar"
              src="${esc(
                document.getElementById('homeAvatar').src
              )}"
            >

            <div>

              <div class="name">
                ${esc(profileName)} 🌈
              </div>

              <div class="time">
                ${esc(timeText)} · 🌐
              </div>

            </div>

          </div>

          ${captionHTML}

          ${imageHTML}

          <div class="actions">

            <button
              onclick="like(this)"
            >☘ Nice</button>

            <button
              onclick="toast('Comments coming next')"
            >💬 Comment</button>

            <button
              onclick="toast('Share coming next')"
            >↗ Share</button>

          </div>

        </article>

      `;

    }).join('');

}


/* =========================
   ESCAPE HTML
========================= */

function esc(s){

  return String(s??'')
    .replace(
      /[&<>'"]/g,
      c=>({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        "'":'&#39;',
        '"':'&quot;'
      }[c])
    );

}


/* =========================
   PHOTO PREVIEW
========================= */

let selectedPostPhoto=null;


document
  .getElementById('postPhoto')
  .addEventListener(
    'change',
    function(e){

      const f =
        e.target.files?.[0];

      if(!f)return;


      if(
        !f.type.startsWith('image/')
      ){

        toast('Please choose an image');

        e.target.value='';

        return;

      }


      if(
        f.size >
        5*1024*1024
      ){

        toast(
          'Image must be under 5MB'
        );

        e.target.value='';

        return;

      }


      selectedPostPhoto=f;


      const reader =
        new FileReader();


      reader.onload=function(){

        document
          .getElementById('previewImage')
          .src=reader.result;

        document
          .getElementById('photoPreview')
          .classList.add('show');

      };


      reader.readAsDataURL(f);

    }
  );


/* =========================
   REMOVE PHOTO
========================= */

function removePostPhoto(){

  selectedPostPhoto=null;

  document
    .getElementById('postPhoto')
    .value='';

  document
    .getElementById('previewImage')
    .src='';

  document
    .getElementById('photoPreview')
    .classList.remove('show');

}


/* =========================
   PUBLISH POST
========================= */

async function publish(){

  const textarea =
    document.getElementById('postText');

  const t =
    textarea.value.trim();

  const photo =
    selectedPostPhoto;


  if(!t && !photo){

    toast(
      'Write something or add a photo first'
    );

    return;

  }


  const u =
    await currentUser();

  if(!u){

    toast('Please login');

    return;

  }


  let finalBody=t;


  /* =========================
     UPLOAD PHOTO
  ========================= */

  if(photo){

    toast('Uploading photo...');


    const ext =
      (
        photo.name
          .split('.')
          .pop() ||
        'jpg'
      )
      .toLowerCase()
      .replace(
        /[^a-z0-9]/g,
        ''
      ) || 'jpg';


    /*
      IMPORTANT:

      Same existing "avatars" bucket.
      We keep the first folder as the
      user's ID so the existing storage
      permission can continue working.
    */

    const path =
      `${u.id}/post-${Date.now()}.${ext}`;


    const up =
      await db
        .storage
        .from('avatars')
        .upload(
          path,
          photo,
          {
            contentType:photo.type,
            upsert:false,
            cacheControl:'3600'
          }
        );


    if(up.error){

      toast(
        'Photo upload failed: '+
        up.error.message
      );

      return;

    }


    const {data:urlData} =
      db
        .storage
        .from('avatars')
        .getPublicUrl(path);


    const publicUrl =
      urlData?.publicUrl;


    if(!publicUrl){

      toast(
        'Could not get photo URL'
      );

      return;

    }


    /*
      Your existing posts table only
      needs "body", so we store the
      photo URL together with the
      caption using our own marker.

      No database column changes needed.
    */

    finalBody =
      '[[PC_PHOTO]]'+
      publicUrl+
      '\n'+
      t;

  }


  /* =========================
     SAVE POST
  ========================= */

  const r =
    await db
      .from('posts')
      .insert({
        user_id:u.id,
        body:finalBody
      });


  if(r.error){

    toast(
      'Post failed: '+
      r.error.message
    );

    return;

  }


  /* =========================
     RESET
  ======
