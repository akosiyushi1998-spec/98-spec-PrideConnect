<script>

const SUPABASE_URL =
'https://uupofonanisdjmmawlml.supabase.co';

const SUPABASE_PUBLISHABLE_KEY =
'sb_publishable_DpZ1Fzh9A6GjblSnRHrAPw__OFGaML_';


const db =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY,
{
auth:{
persistSession:true,
autoRefreshToken:true,
detectSessionInUrl:true
}
}
);


const FALLBACK =
'https://placehold.co/160x160/png?text=YU';

let toastTimer;


/* =========================
   TOAST
========================= */

function toast(m){

const e =
document.getElementById('toast');

e.textContent=m;

e.classList.add('show');

clearTimeout(toastTimer);

toastTimer=setTimeout(
()=>e.classList.remove('show'),
1700
);

}


/* =========================
   NAVIGATION
========================= */

function openScreen(id,btn){

document
.querySelectorAll('.screen')
.forEach(x=>x.classList.remove('active'));

const target =
document.getElementById(id);

if(target)
target.classList.add('active');

document
.querySelectorAll('.nav')
.forEach(x=>x.classList.remove('active'));

if(btn)
btn.classList.add('active');

window.scrollTo(0,0);

}


/* =========================
   AVATARS
========================= */

function setAvatars(url){

[
'homeAvatar',
'profileImage'
]
.forEach(id=>{

const e =
document.getElementById(id);

if(e)
e.src=url||FALLBACK;

});

}


/* =========================
   CURRENT USER
========================= */

async function currentUser(){

const r =
await db.auth.getUser();

return r.data.user;

}


/* =========================
   PROFILE
========================= */

async function loadProfile(){

const u =
await currentUser();

if(!u)return;


let {data} =
await db
.from('profiles')
.select(
'display_name,username,avatar_url'
)
.eq('id',u.id)
.maybeSingle();


if(!data){

const name =
u.user_metadata?.display_name ||
u.email?.split('@')[0] ||
'User';

const username =
(
'u'+
u.id
.replace(/-/g,'')
.slice(0,10)
)
.toLowerCase();


const insertResult =
await db
.from('profiles')
.insert({
id:u.id,
display_name:name,
username
});


data={
display_name:name,
username,
avatar_url:null
};

}


document
.getElementById('profileName')
.textContent =
data.display_name||'User';


document
.getElementById('profileUsername')
.textContent =
'@'+
(data.username||'user');


setAvatars(
data.avatar_url||FALLBACK
);

loadFeed();

}


/* =========================
   FEED
========================= */

async function loadFeed(){

const u =
await currentUser();

if(!u)return;


const box =
document.getElementById('feed');


const r =
await db
.from('posts')
.select(
'id,body,created_at'
)
.eq('user_id',u.id)
.order(
'created_at',
{ascending:false}
)
.limit(30);


if(
r.error ||
!r.data?.length
){

box.innerHTML =
'<div class="empty card">'+
'Wala ka pang post. ✨<br>'+
'Gumawa ng first post mo sa taas.'+
'</div>';

return;

}


const avatar =
document
.getElementById('homeAvatar')
.src;

const name =
document
.getElementById('profileName')
.textContent;


box.innerHTML =
r.data.map(p=>{

const parsed =
parsePost(p.body);

const photo =
parsed.photo
?
`
<img
class="post-image"
src="${escAttr(parsed.photo)}"
alt="Post photo"
onclick="viewPhoto('${escAttr(parsed.photo)}')"
>
`
:
'';


const text =
parsed.text
?
`
<div class="msg">
${esc(parsed.text)}
</div>
`
:
'';


return `

<article class="card">

<div class="head">

<img
class="avatar"
src="${escAttr(avatar)}"
>

<div>

<div class="name">
${esc(name)}
🌈
</div>

<div class="time">
${formatTime(p.created_at)}
</div>

</div>

</div>

${text}

${photo}

<div class="actions">

<button onclick="like(this)">
☘ Nice
</button>

<button
onclick="toast('Comments coming next')">
💬 Comment
</button>

<button
onclick="toast('Share coming next')">
↗ Share
</button>

</div>

</article>

`;

}).join('');

}


/* =========================
   POST FORMAT
========================= */

/*
Photo URL is stored inside the existing
posts.body column.

This means:
NO new database column needed.
*/

function makePostBody(text,photo){

return JSON.stringify({
text:text||'',
photo:photo||''
});

}


function parsePost(body){

try{

const obj =
JSON.parse(body);

if(
obj &&
typeof obj==='object' &&
(
'text' in obj ||
'photo' in obj
)
){

return {
text:obj.text||'',
photo:obj.photo||''
};

}

}catch(e){}


/*
Old text-only posts continue working.
*/

return {
text:body||'',
photo:''
};

}


/* =========================
   ESCAPE
========================= */

function esc(s){

return String(s??'')
.replace(
/[&<>'"]/g,
c=>({

'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
"'":'&#39;',
'"':'&quot;'

}[c])
);

}


function escAttr(s){

return String(s??'')
.replace(
/[&<>"']/g,
c=>({

'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'

}[c])
);

}


/* =========================
   TIME
========================= */

function formatTime(date){

if(!date)
return 'Just now · 🌐';

const d =
new Date(date);

const diff =
Math.floor(
(Date.now()-d.getTime())/1000
);

if(diff<60)
return 'Just now · 🌐';

if(diff<3600)
return Math.floor(diff/60)+'m ago · 🌐';

if(diff<86400)
return Math.floor(diff/3600)+'h ago · 🌐';

return d.toLocaleDateString();

}


/* =========================
   PHOTO POST
========================= */

let selectedPostPhoto=null;


/* Open file picker */

function openPostPhoto(){

document
.getElementById('postPhoto')
.click();

}


/* Remove selected photo */

function removePostPhoto(){

selectedPostPhoto=null;

document
.getElementById('photoPreviewImage')
.src='';

document
.getElementById('photoPreview')
.classList.remove('show');

document
.getElementById('postPhoto')
.value='';

}


/* Select photo */

document
.getElementById('postPhoto')
.addEventListener(
'change',
async e=>{

const f =
e.target.files?.[0];

if(!f)return;


if(
!f.type.startsWith('image/') ||
f.size>5*1024*1024
){

toast(
'Image must be under 5MB'
);

e.target.value='';

return;

}


selectedPostPhoto=f;


const preview =
document
.getElementById('photoPreviewImage');


preview.src =
URL.createObjectURL(f);


document
.getElementById('photoPreview')
.classList.add('show');


toast('Photo selected');

}
);


/* =========================
   PUBLISH
========================= */

async function publish(){

const text =
document
.getElementById('postText')
.value
.trim();


if(!text && !selectedPostPhoto){

toast(
'Write something or choose a photo first'
);

return;

}


const u =
await currentUser();

if(!u){

toast('Please login');

return;

}


let photoUrl='';


/*
Upload photo first.
Uses the EXISTING avatars bucket.
*/

if(selectedPostPhoto){

toast('Uploading photo...');


const f =
selectedPostPhoto;


const ext =
(
f.name.split('.').pop() ||
'jpg'
)
.toLowerCase()
.replace(
/[^a-z0-9]/g,
''
);


const path =
`${u.id}/post-${Date.now()}.${ext}`;


const up =
await db.storage
.from('avatars')
.upload(
path,
f,
{
contentType:f.type,
upsert:false,
cacheControl:'3600'
}
);


if(up.error){

toast(
'Photo upload failed: '+
up.error.message
);

return;

}


const publicResult =
db.storage
.from('avatars')
.getPublicUrl(path);


photoUrl =
publicResult.data.publicUrl;

}


/*
Save text + photo URL
inside existing body column.
*/

const body =
makePostBody(
text,
photoUrl
);


const r =
await db
.from('posts')
.insert({
user_id:u.id,
body
});


if(r.error){

toast(
'Post failed: '+
r.error.message
);

return;

}


/* Clear composer */

document
.getElementById('postText')
.value='';


removePostPhoto();

toast('Posted!');

await loadFeed();

}


/* =========================
   PHOTO VIEW
========================= */

function viewPhoto(url){

if(!url)return;

const win =
window.open(
'',
'_blank'
);

if(!win){

toast('Tap image again to open');

return;

}

win.document.write(`
<!doctype html>
<html>
<head>
<title>Pride Connect Photo</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{
margin:0;
background:#000;
display:flex;
align-items:center;
justify-content:center;
min-height:100vh
}
img{
max-width:100%;
max-height:100vh;
object-fit:contain
}
</style>
</head>
<body>
<img src="${escAttr(url)}">
</body>
</html>
`);

}


/* =========================
   LIKE
========================= */

function like(b){

b.classList.toggle('liked');

toast(
b.classList.contains('liked')
?
'Nice added!'
:
'Nice removed!'
);

}


/* =========================
   LOGIN
========================= */

async function login(){

const email =
document
.getElementById('email')
.value
.trim();

const password =
document
.getElementById('password')
.value;

const msg =
document
.getElementById('authMsg');

msg.textContent='';


if(!email||!password){

msg.textContent =
'Ilagay ang email at password.';

return;

}


const r =
await db.auth.signInWithPassword({
email,
password
});


if(r.error){

msg.textContent =
r.error.message;

return;

}


toast('Login successful!');

await showApp();

}


/* =========================
   SIGN UP
========================= */

async function signup(){

const email =
document
.getElementById('email')
.value
.trim();

const password =
document
.getElementById('password')
.value;

const name =
document
.getElementById('displayName')
.value
.trim() ||
'User';

const msg =
document
.getElementById('authMsg');

msg.textContent='';


if(!email||!password){

msg.textContent =
'Ilagay ang email at password.';

return;

}


if(password.length<6){

msg.textContent =
'Password must be at least 6 characters.';

return;

}


const r =
await db.auth.signUp({

email,
password,

options:{
data:{
display_name:name
}
}

});


if(r.error){

msg.textContent =
r.error.message;

return;

}


if(r.data.session){

toast('Account created!');

await showApp();

}else{

msg.textContent =
'Account created. Check your email to confirm your account before logging in.';

}

}


/* =========================
   LOGOUT
========================= */

async function logout(){

await db.auth.signOut();


document
.getElementById('app')
.classList.add('hide');

f.size>5*1024*1024

`${u.id}/profile-${Date.now()}.${ext}`;
