<!doctype html>

<head>

<style>
*{box-sizing:border-box}
html,body{margin:0;background:#f7f7fb;color:#171827;font-family:Arial,sans-serif}
button,input,textarea{font:inherit}
button{touch-action:manipulation}
.app{max-width:430px;min-height:100vh;margin:auto;background:#fafafd}
.hide{display:none!important}

.top{
height:68px;background:#fff;border-bottom:1px solid #ddd;
display:flex;align-items:center;justify-content:space-between;

.logo{

}

.icons{display:flex;gap:5px}
.icon,.nav,.more{border:0;background:#fff;cursor:pointer}

.icon{

.screen{

}

.screen.active{display:block}

.card{

.composer{

display:flex;
gap:10px

.avatar{

.compose{

.head{

}

.hero{

.big{

border-radius:10px;

color:#fff;

cursor:pointer

.profile-banner{
height:72px;
background:linear-gradient(110deg,#4d00e8,#9400e3,#ff7900);

}

.profile-body{padding:18px}

.profile-wrap .avatar{

.camera{

right:-3px;

color:#fff;

align-items:center;
justify-content:center;

}

.upload{
width:100%;
height:50px;
margin-top:17px;
border:2px solid #6c18df;
background:#fff;
color:#5c13d6;
border-radius:9px;
font-weight:bold;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer
}

.bottom{
position:fixed;
left:0;
right:0;
bottom:0;
height:68px;
background:#fff;
border-top:1px solid #ddd;
display:grid;
grid-template-columns:repeat(5,1fr);
z-index:30;
max-width:430px;
margin:auto
}

.nav{
font-size:11px;
color:#151722;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
cursor:pointer
}

.nav b{
font-size:23px;
line-height:24px
}

.nav.active{color:#5d12d8}

.auth{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
background:linear-gradient(135deg,#faf0ff,#fff)
}

.authbox{
width:100%;
max-width:390px;
background:#fff;
padding:24px;
border-radius:20px;
box-shadow:0 8px 30px #0001
}

.authbox h1{margin-top:0}

.authbox input{
width:100%;
height:50px;
margin:7px 0;
padding:0 14px;
border:1px solid #ddd;
border-radius:10px;
outline:none
}

.authbox input:focus{
border-color:#6415df
}

.primary,.secondary{
width:100%;
height:50px;
margin-top:10px;
border-radius:10px;
font-weight:700;
cursor:pointer
}

.primary{
border:0;
background:#6415df;
color:#fff
}

.secondary{
border:2px solid #6415df;
background:#fff;
color:#6415df
}

.primary:disabled,
.secondary:disabled{
opacity:.6;
cursor:not-allowed
}

.msgbox{
min-height:20px;
color:#c33;
font-size:13px;
margin:6px 0
}

.toast{
position:fixed;
left:50%;
bottom:88px;
transform:translate(-50%,10px);
background:#222;
color:#fff;
padding:11px 15px;
border-radius:9px;
opacity:0;
pointer-events:none;
transition:.2s;
z-index:50;
max-width:90%;
text-align:center
}

.toast.show{
opacity:1;
transform:translate(-50%,0)
}

.post-image{
width:100%;
max-height:420px;
object-fit:cover;
border-radius:12px;
margin-top:12px
}
</style>
</head>

<body>

<!-- AUTH -->
<div id="auth" class="auth">

<div class="authbox">

🌈 <span style="color:#6415df">Pride Connect</span>
</h1>

Dating

type="button"
onclick="openScreen('wallet',this)">
<b>▣</b>
Wallet

class="nav"
type="button"

Shop

Profile

<div id="toast" class="toast"></div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
'https://uupofonanisdjmmawlml.supabase.co';

const SUPABASE_PUBLISHABLE_KEY =
'sb_publishable_DpZ1Fzh9A6GjblSnRHrAPw__OFGaML_';


const db = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY,
{
auth:{
persistSession:true,
autoRefreshToken:true,
detectSessionInUrl:true
}
}
);


const FALLBACK =
'https://placehold.co/160x160/png?text=YU';

let toastTimer = null;
let authBusy = false;


/* =========================================
   TOAST
========================================= */

function toast(message){

const element =
document.getElementById('toast');

element.textContent = message;

element.classList.add('show');

clearTimeout(toastTimer);

toastTimer = setTimeout(()=>{
element.classList.remove('show');
},1800);

}


/* =========================================
   SCREEN NAVIGATION
========================================= */

function openScreen(id,btn){

document
.querySelectorAll('.screen')
.forEach(screen=>{
screen.classList.remove('active');
});

const target =
document.getElementById(id);

if(target){
target.classList.add('active');
}

document
.querySelectorAll('.nav')
.forEach(nav=>{
nav.classList.remove('active');
});

if(btn){
btn.classList.add('active');
}

window.scrollTo(0,0);

}


/* =========================================
   AVATARS
========================================= */

function setAvatars(url){

const finalUrl =
url || FALLBACK;

const ids=[
'homeAvatar',
'profileImage'
];

ids.forEach(id=>{

const element =
document.getElementById(id);

if(element){
element.src=finalUrl;
}

});

}


/* =========================================
   CURRENT USER
========================================= */

async function currentUser(){

try{

const result =
await db.auth.getUser();

return result.data?.user || null;

}catch(error){

console.error('currentUser error:',error);

return null;

}

}


/* =========================================
   LOAD PROFILE
========================================= */

async function loadProfile(){

const user =
await currentUser();

if(!user){
return;
}


let profileResult =
await db
.from('profiles')
.select('display_name,username,avatar_url')
.eq('id',user.id)
.maybeSingle();


let profile =
profileResult.data;


if(!profile){

const name =
user.user_metadata?.display_name ||
user.email?.split('@')[0] ||
'User';

const username =
('u'+user.id.replace(/-/g,'').slice(0,10))
.toLowerCase();


const insert =
await db
.from('profiles')
.insert({
id:user.id,
display_name:name,
username:username
})
.select('display_name,username,avatar_url')
.maybeSingle();


if(insert.error){

console.warn(
'Profile insert:',
insert.error.message
);

profile={
display_name:name,
username:username,
avatar_url:null
};

}else{

profile =
insert.data || {
display_name:name,
username:username,
avatar_url:null
};

}

}


document
.getElementById('profileName')
.textContent =
profile.display_name || 'User';


document
.getElementById('profileUsername')
.textContent =
'@'+(profile.username || 'user');


setAvatars(
profile.avatar_url || FALLBACK
);

await loadFeed();

}


/* =========================================
   LOAD FEED
========================================= */

async function loadFeed(){

const user =
await currentUser();

if(!user){
return;
}


const box =
document.getElementById('feed');


const result =
await db
.from('posts')
.select('id,body,created_at')
.eq('user_id',user.id)
.order('created_at',{ascending:false})
.limit(30);


if(result.error){

console.error(
'Feed error:',
result.error.message
);

box.innerHTML=
'<div class="empty card">'+
'Hindi ma-load ang posts ngayon.'+
'</div>';

return;

}


if(!result.data?.length){

box.innerHTML=
'<div class="empty card">'+
'Wala ka pang post. ✨<br>'+
'Gumawa ng first post mo sa taas.'+
'</div>';

return;

}


const profileName =
document
.getElementById('profileName')
.textContent || 'User';


const avatar =
document
.getElementById('homeAvatar')
.src || FALLBACK;


box.innerHTML =
result.data.map(post=>{

const date =
post.created_at
? new Date(post.created_at).toLocaleString()
: 'Just now';


return `

<article class="card">

<div class="head">

<img
class="avatar"
src="${esc(avatar)}"
alt="Profile"
>

<div>

<div class="name">
${esc(profileName)} 🌈
</div>

<div class="time">
${esc(date)} · 🌐
</div>

</div>

</div>

<div class="msg">
${esc(post.body)}
</div>

<div class="actions">

<button
type="button"
onclick="like(this)">
☘ Nice
</button>

<button
type="button"
onclick="toast('Comments coming next')">
💬 Comment
</button>

<button
type="button"
onclick="toast('Share coming next')">
↗ Share
</button>

</div>

</article>

`;

}).join('');

}


/* =========================================
   ESCAPE HTML
========================================= */

function esc(value){

return String(value ?? '')
.replace(/[&<>'"]/g,character=>({

'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
"'":'&#39;',
'"':'&quot;'

}[character]));

}


/* =========================================
   PUBLISH TEXT POST
========================================= */

async function publish(){

const text =
document
.getElementById('postText')
.value
.trim();


if(!text){

toast('Write something first');

return;

}


const user =
await currentUser();

if(!user){

toast('Please login');

return;

}


const result =
await db
.from('posts')
.insert({
user_id:user.id,
body:text
});


if(result.error){

toast(
'Post failed: '+
result.error.message
);

console.error(result.error);

return;

}


document
.getElementById('postText')
.value='';


toast('Posted!');

await loadFeed();

}


/* =========================================
   LIKE
========================================= */

function like(button){

button.classList.toggle('liked');

toast(
button.classList.contains('liked')
? 'Nice added!'
: 'Nice removed!'
);

}


/* =========================================
   LOGIN
========================================= */

async function login(){

if(authBusy){
return;
}

const email =
document
.getElementById('email')
.value
.trim();

const password =
document
.getElementById('password')
.value;

const message =
document
.getElementById('authMsg');

const button =
document
.getElementById('login');


message.textContent='';


if(!email || !password){

message.textContent =
'Ilagay ang email at password.';

return;

}


authBusy=true;

button.disabled=true;
button.textContent='Logging in...';


try{

const result =
await db.auth.signInWithPassword({
email:email,
password:password
});


if(result.error){

message.textContent =
result.error.message;

return;

}


if(!result.data?.session){

message.textContent =
'Login failed. Walang active session.';

return;

}


/*
IMPORTANT:
Direkta nating ipinapakita ang app.
Hindi na natin tatawagin ang auth listener
para maiwasan ang duplicate showApp().
*/

await showApp();

toast('Login successful!');


}catch(error){

console.error('Login error:',error);

message.textContent =
error.message ||
'May error sa pag-login.';

}finally{

authBusy=false;

button.disabled=false;
button.textContent='Login';

}

}


/* =========================================
   SIGN UP
========================================= */

async function signup(){

if(authBusy){
return;
}

const email =
document
.getElementById('email')
.value
.trim();

const password =
document
.getElementById('password')
.value;

const name =
document
.getElementById('displayName')
.value
.trim() || 'User';

const message =
document
.getElementById('authMsg');

const button =
document
.getElementById('signup');


message.textContent='';


if(!email || !password){

message.textContent =
'Ilagay ang email at password.';

return;

}


if(password.length < 6){

message.textContent =
'Password must be at least 6 characters.';

return;

}


authBusy=true;

button.disabled=true;
button.textContent='Creating account...';


try{

const result =
await db.auth.signUp({

email:email,

password:password,

options:{
data:{
display_name:name
}
}

});


if(result.error){

message.textContent =
result.error.message;

return;

}


if(result.data?.session){

await showApp();

toast('Account created!');

}else{

message.textContent =
'Account created. Check your email to confirm your account, then login.';

}

}catch(error){

console.error('Signup error:',error);

message.textContent =
error.message ||
'May error sa paggawa ng account.';

}finally{

authBusy=false;

button.disabled=false;
button.textContent='Create Account';

}

}


/* =========================================
   LOGOUT
========================================= */

async function logout(){

try{

await db.auth.signOut();

}catch(error){

console.error('Logout error:',error);

}


document
.getElementById('app')
.classList.add('hide');

document
.getElementById('auth')
.classList.remove('hide');


document
.getElementById('password')
.value='';


document
.getElementById('authMsg')
.textContent='';


toast('Logged out');

}


/* =========================================
   SHOW APP
========================================= */

async function showApp(){

document
.getElementById('auth')
.classList.add('hide');

document
.getElementById('app')
.classList.remove('hide');

await loadProfile();

}


/* =========================================
   PROFILE PHOTO
========================================= */

document
.getElementById('profileUpload')
.addEventListener(
'change',
async event=>{

const file =
event.target.files?.[0];

if(!file){
return;
}


const user =
await currentUser();

if(!user){

toast('Please login');

return;

}


if(
!file.type.startsWith('image/') ||
file.size > 5*1024*1024
){

toast('Image must be under 5MB');

event.target.value='';

return;

}


const extension =
(file.name.split('.').pop() || 'jpg')
.toLowerCase()
.replace(/[^a-z0-9]/g,'');


const path =
`${user.id}/profile-${Date.now()}.${extension}`;


toast('Uploading...');


try{

const upload =
await db.storage
.from('avatars')
.upload(
path,
file,
{
contentType:file.type,
upsert:false,
cacheControl:'3600'
}
);


if(upload.error){

toast(
'Upload failed: '+
upload.error.message
);

console.error(upload.error);

return;

}


const publicUrl =
db.storage
.from('avatars')
.getPublicUrl(path)
.data.publicUrl;


const update =
await db
.from('profiles')
.update({
avatar_url:publicUrl
})
.eq('id',user.id);


if(update.error){

toast(
'Profile update failed: '+
update.error.message
);

console.error(update.error);

return;

}


setAvatars(publicUrl);

toast('Profile picture updated!');


}catch(error){

console.error(
'Profile upload error:',
error
);

toast(
'Upload failed: '+
(error.message || 'Unknown error')
);

}finally{

event.target.value='';

}

});


/* =========================================
   PHOTO POST BUTTON
========================================= */

function openPostPhoto(){

document
.getElementById('postPhoto')
.click();

}


document
.getElementById('postPhoto')
.addEventListener(
'change',
async
