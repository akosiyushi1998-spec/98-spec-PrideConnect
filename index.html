<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>Pride Connect</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f6f6f8;
    font-family:Arial,Helvetica,sans-serif;
    color:#171717;
}

button,
input,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    max-width:900px;
    min-height:100vh;
    margin:auto;
    background:#fff;
    padding-bottom:75px;
}

/* HEADER */

header{
    height:68px;
    padding:10px 14px;
    border-bottom:1px solid #eee;

    display:flex;
    align-items:center;
    justify-content:space-between;

    position:sticky;
    top:0;
    background:#fff;
    z-index:20;
}

.logo{
    font-size:23px;
    font-weight:800;

    background:
        linear-gradient(
            90deg,
            #f22,
            #7020df,
            #1855e8
        );

    -webkit-background-clip:text;
    color:transparent;
}

.rainbow{
    font-size:27px;
}

.header-buttons{
    display:flex;
    gap:7px;
}

.icon-button{
    width:42px;
    height:42px;

    border:0;
    border-radius:13px;

    background:#f5f5f6;

    font-size:20px;
}

/* MAIN */

main{
    padding:14px;
}

.card{
    background:#fff;
    border:1px solid #e8e8e8;
    border-radius:17px;

    box-shadow:
        0 2px 10px #00000008;

    margin-bottom:14px;
}

/* COMPOSER */

.composer{
    padding:14px;

    display:flex;
    gap:10px;
}

.avatar{
    width:52px;
    height:52px;

    border-radius:50%;

    object-fit:cover;

    background:#ddd;

    flex-shrink:0;
}

.grow{
    flex:1;
}

.composer input{
    width:100%;

    border:0;
    outline:0;

    padding:12px 3px;

    font-size:17px;
}

.composer-tools{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.image-button{
    border:0;
    background:none;

    font-size:22px;
}

.post-button,
.primary-button{
    border:0;

    background:#6419d9;
    color:#fff;

    border-radius:10px;

    padding:11px 19px;

    font-weight:700;
}

/* POSTS */

.post{
    padding:14px;
}

.post-header{
    display:flex;
    align-items:center;
    gap:10px;
}

.post-name{
    font-weight:800;
}

.post-meta{
    font-size:13px;
    color:#777;

    margin-top:3px;
}

.more-button{
    margin-left:auto;

    border:0;
    background:transparent;

    font-size:22px;
}

.post-text{
    font-size:17px;
    line-height:1.45;

    margin:16px 0;
}

.post-actions{
    border-top:1px solid #eee;

    padding-top:9px;

    display:flex;
    justify-content:space-around;
}

.action-button{
    border:0;
    background:transparent;

    padding:7px 9px;

    font-weight:700;

    color:#444;

    border-radius:9px;
}

/* CLOVER */

.clover{
    font-size:21px;
    color:#59b72d;
}

.nice.active{
    color:#6419d9;
}

.nice.active .clover{
    color:#6419d9;
}

/* SIDEBAR */

.sidebar{
    padding:14px;
}

.profile-banner{
    height:74px;

    border-radius:13px;

    background:
        linear-gradient(
            100deg,
            #4b00ff,
            #df00dc,
            #ff4900
        );

    margin-bottom:16px;
}

.profile-header{
    display:flex;
    align-items:center;

    gap:12px;
}

.big-avatar{
    width:84px;
    height:84px;

    border-radius:50%;

    object-fit:cover;

    background:#ddd;
}

.profile-name{
    font-size:24px;
    font-weight:800;
}

.username{
    color:#6419d9;
    font-weight:700;
}

.bio{
    margin:12px 0;

    line-height:1.4;
}

.outline-button{
    border:2px solid #6419d9;

    color:#6419d9;

    background:#fff;

    border-radius:10px;

    padding:10px 15px;

    font-weight:700;
}

/* PEOPLE */

.person{
    display:flex;
    align-items:center;

    gap:9px;

    padding:9px 0;

    border-bottom:1px solid #eee;
}

.person img{
    width:44px;
    height:44px;

    border-radius:50%;

    object-fit:cover;
}

.follow-button{
    margin-left:auto;
}

.following{
    background:#6419d9;
    color:#fff;
}

/* BOTTOM NAV */

.bottom-nav{
    position:fixed;

    bottom:0;
    left:50%;

    transform:translateX(-50%);

    width:min(900px,100%);

    height:70px;

    background:#fff;

    border-top:1px solid #eee;

    display:flex;

    justify-content:space-around;

    z-index:30;
}

.nav-button{
    border:0;
    background:none;

    font-size:13px;

    color:#222;

    min-width:65px;
}

.nav-button span{
    display:block;

    font-size:23px;

    margin-bottom:2px;
}

.nav-button.active{
    color:#6419d9;

    font-weight:700;
}

/* MODAL */

.modal{
    display:none;

    position:fixed;

    inset:0;

    background:#0008;

    z-index:50;

    align-items:flex-end;
}

.modal-content{
    background:#fff;

    width:min(900px,100%);

    border-radius:20px 20px 0 0;

    padding:20px;

    max-height:92vh;

    overflow:auto;
}

.close-button{
    float:right;

    border:0;

    background:#eee;

    border-radius:50%;

    width:35px;
    height:35px;

    font-size:20px;
}

.input{
    width:100%;

    padding:13px;

    border:1px solid #ddd;

    border-radius:11px;

    margin:7px 0;

    outline:none;
}

.input:focus{
    border-color:#6419d9;
}

.message{
    min-height:22px;

    font-size:14px;

    margin:7px 0;
}

.hidden{
    display:none;
}

/* DESKTOP */

@media(min-width:760px){

    main{
        display:grid;

        grid-template-columns:
            1.6fr
            1fr;

        gap:14px;
    }

    .composer{
        grid-column:1;
    }

    .feed{
        grid-column:1;
    }

    .sidebar{
        grid-column:2;
        grid-row:1 / 3;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- HEADER -->

<header>

    <div>
        <span class="rainbow">🌈</span>

        <span class="logo">
            Pride Connect
        </span>
    </div>

    <div class="header-buttons">

        <button
            class="icon-button"
            onclick="showMessage('No new notifications')">

            🔔

        </button>

        <button
            class="icon-button"
            onclick="showMessage('Messages')">

            💬

        </button>

        <button
            class="icon-button"
            onclick="openProfile()">

            👤

        </button>

    </div>

</header>


<!-- MAIN -->

<main>

    <!-- POST COMPOSER -->

    <section class="card composer">

        <img
            id="composerAvatar"
            class="avatar"
            alt="Profile">

        <div class="grow">

            <input
                id="postInput"
                type="text"
                maxlength="500"
                placeholder="What's on your mind?">

            <div class="composer-tools">

                <button
                    class="image-button"
                    onclick="choosePostImage()">

                    🖼️

                </button>

                <input
                    id="postImage"
                    type="file"
                    accept="image/*"
                    class="hidden">

                <button
                    class="post-button"
                    onclick="createPost()">

                    Post

                </button>

            </div>

        </div>

    </section>


    <!-- FEED -->

    <section
        id="feed"
        class="feed">
    </section>


    <!-- PROFILE SIDEBAR -->

    <aside class="card sidebar">

        <div class="profile-banner"></div>

        <div class="profile-header">

            <img
                id="sideAvatar"
                class="big-avatar"
                alt="Profile">

            <div>

                <div
                    id="sideName"
                    class="profile-name">

                    Guest

                </div>

                <div
                    id="sideUsername"
                    class="username">

                    @guest

                </div>

            </div>

        </div>

        <div
            id="sideBio"
            class="bio">

            Be yourself,
            everyone else is already taken.

        </div>

        <button
            class="outline-button"
            style="width:100%"
            onclick="openProfile()">

            ✎ Edit Profile

        </button>

        <div
            style="
                text-align:center;
                font-size:25px;
                margin:14px;
            ">

            🔵 📷 🎵 🟣

        </div>

        <h3>
            People you may like
        </h3>

        <div id="people"></div>

    </aside>

</main>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

    <button
        class="nav-button active"
        onclick="setNavigation(this,'Home')">

        <span>⌂</span>
        Home

    </button>

    <button
        class="nav-button"
        onclick="setNavigation(this,'Dating')">

        <span>♥</span>
        Dating

    </button>

    <button
        class="nav-button"
        onclick="setNavigation(this,'Wallet')">

        <span>▣</span>
        Wallet

    </button>

    <button
        class="nav-button"
        onclick="setNavigation(this,'Shop')">

        <span>🛍️</span>
        Shop

    </button>

    <button
        class="nav-button"
        onclick="openProfile()">

        <span>👤</span>
        Profile

    </button>

</nav>

</div>


<!-- MODAL -->

<div
    id="modal"
    class="modal"
    onclick="
        if(event.target === this)
        closeModal()
    ">

    <div
        id="modalContent"
        class="modal-content">
    </div>

</div>


<script>

/* =====================================================
   SUPABASE CONNECTION
===================================================== */

const SUPABASE_URL =
"https://uupofonanisdjmmawlml.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_DpZ1Fzh9A6GjblSnRHrAPw__OFGaML_";


let supabaseClient = null;

let currentUser = null;

let currentProfile = null;

let selectedAvatarFile = null;


if(
    window.supabase &&
    SUPABASE_URL &&
    SUPABASE_PUBLISHABLE_KEY
){

    supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );

}


/* =====================================================
   DEFAULT AVATAR
===================================================== */

const DEFAULT_AVATAR =
"data:image/svg+xml;charset=UTF-8," +
encodeURIComponent(`

<svg
xmlns="http://www.w3.org/2000/svg"
width="200"
height="200">

<rect
width="100%"
height="100%"
fill="#eeeeee"/>

<circle
cx="100"
cy="75"
r="38"
fill="#aaaaaa"/>

<path
d="M35 190
C45 140 155 140 165 190"
fill="#aaaaaa"/>

</svg>

`);


/* =====================================================
   HELPERS
===================================================== */

function setImage(id,url){

    const element =
        document.getElementById(id);

    if(!element)return;

    element.src =
        url || DEFAULT_AVATAR;
}


function escapeHTML(value){

    return String(value || "")
        .replace(/[&<>"']/g,function(char){

            return {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[char];

        });

}


function showMessage(message){

    alert(message);

}


function openModal(html){

    document
        .getElementById("modalContent")
        .innerHTML = html;

    document
        .getElementById("modal")
        .style.display = "flex";

}


function closeModal(){

    document
        .getElementById("modal")
        .style.display = "none";

}


/* =====================================================
   DEMO FEED
===================================================== */

function showDemoFeed(){

    document
        .getElementById("feed")
        .innerHTML = `

        <article class="card post">

            <div class="post-header">

                <img
                    class="avatar"
                    src="${DEFAULT_AVATAR}">

                <div>

                    <div class="post-name">
                        YUSHI018 🌈
                    </div>

                    <div class="post-meta">
                        Just now · 🌐
                    </div>

                </div>

                <button class="more-button">
                    ⋮
                </button>

            </div>


            <div class="post-text">

                Good morning!
                Have a great day everyone! 🌈

            </div>


            <div class="post-actions">

                <button
                    class="action-button nice"
                    onclick="toggleNice(this)">

                    <span class="clover">
                        🍀
                    </span>

                    Nice

                </button>

                <button class="action-button">
                    💬 Comment
                </button>

                <button
                    class="action-button"
                    onclick="sharePost()">

                    ↗ Share

                </button>

                <span class="action-button">
                    ◉ 126
                </span>

            </div>

        </article>


        <article class="card post">

            <div class="post-header">

                <img
                    class="avatar"
                    src="${DEFAULT_AVATAR}">

                <div>

                    <div class="post-name">
                        Alex
                    </div>

                    <div class="post-meta">
                        1 hour ago · 🌐
                    </div>

                </div>

            </div>


            <div class="post-text">

                Life is better when
                you're being yourself. 💜

            </div>


            <div class="post-actions">

                <button
                    class="action-button nice"
                    onclick="toggleNice(this)">

                    <span class="clover">
                        🍀
                    </span>

                    Nice

                </button>

                <button class="action-button">
                    💬 Comment
                </button>

                <button
                    class="action-button"
                    onclick="sharePost()">

                    ↗ Share

                </button>

                <span class="action-button">
                    ◉ 89
                </span>

            </div>

        </article>

    `;

}


/* =====================================================
   NICE BUTTON
===================================================== */

function toggleNice(button){

    button.classList.toggle("active");

}


/* =====================================================
   AUTH
===================================================== */

function openAuth(){

    openModal(`

        <button
            class="close-button"
            onclick="closeModal()">

            ×

        </button>

        <h2>
            Welcome to Pride Connect 🌈
        </h2>

        <input
            id="authEmail"
            class="input"
            type="email"
            placeholder="Email">

        <input
            id="authPassword"
            class="input"
            type="password"
            placeholder="Password (6+ characters)">

        <div
            id="authMessage"
            class="message">
        </div>

        <button
            class="primary-button"
            style="width:100%"
            onclick="signUp()">

            Sign Up

        </button>

        <button
            class="outline-button"
            style="
                width:100%;
                margin-top:8px;
            "
            onclick="login()">

            Login

        </button>

    `);

}


async function signUp(){

    const message =
        document.getElementById(
            "authMessage"
        );

    const email =
        document
        .getElementById("authEmail")
        .value
        .trim();

    const password =
        document
        .getElementById("authPassword")
        .value;


    if(!supabaseClient){

        message.textContent =
            "Supabase connection error.";

        return;

    }


    if(!email || !password){

        message.textContent =
            "Ilagay ang email at password.";

        return;

    }


    if(password.length < 6){

        message.textContent =
            "Password must be at least 6 characters.";

        return;

    }


    message.textContent =
        "Creating account...";


    const result =
        await supabaseClient.auth.signUp({

            email:email,

            password:password

        });


    if(result.error){

        message.textContent =
            result.error.message;

        return;

    }


    if(result.data.session){

        message.textContent =
            "Account created! 🎉";

        await loadApp();

        setTimeout(
            closeModal,
            700
        );

    }else{

        message.textContent =
            "Account created! Check your email to confirm.";

    }

}


async function login(){

    const message =
        document.getElementById(
            "authMessage"
        );

    const email =
        document
        .getElementById("authEmail")
        .value
        .trim();

    const password =
        document
        .getElementById("authPassword")
        .value;


    if(!email || !password){

        message.textContent =
            "Ilagay ang email at password.";

        return;

    }


    message.textContent =
        "Logging in...";


    const result =
        await supabaseClient.auth
        .signInWithPassword({

            email:email,

            password:password

        });


    if(result.error){

        message.textContent =
            result.error.message;

        return;

    }


    await loadApp();

    closeModal();

}


/* =====================================================
   PROFILE
===================================================== */

async function loadProfile(){

    if(!currentUser)return;


    const result =
        await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id",currentUser.id)
        .maybeSingle();


    if(result.error){

        console.error(result.error);

        return;

    }


    currentProfile =
        result.data;


    if(!currentProfile){

        const username =
            "user_" +
            currentUser.id
            .substring(0,8);


        const create =
            await supabaseClient
            .from("profiles")
            .insert({

                id:currentUser.id,

                display_name:
                    currentUser.email
                    ?.split("@")[0]
                    || "User",

                username:username,

                bio:
                    "Be yourself, everyone else is already taken."

            });


        if(!create.error){

            return loadProfile();

        }

    }


    document
        .getElementById("sideName")
        .textContent =
        currentProfile?.display_name
        || "Your Name";


    document
        .getElementById("sideUsername")
        .textContent =
        "@" +
        (
            currentProfile?.username
            || "username"
        );


    document
        .getElementById("sideBio")
        .textContent =
        currentProfile?.bio
        || "Be yourself, everyone else is already taken.";


    setImage(
        "sideAvatar",
        currentProfile?.avatar_url
    );


    setImage(
        "composerAvatar",
        currentProfile?.avatar_url
    );

}


/* =====================================================
   OPEN PROFILE
===================================================== */

function openProfile(){

    if(!currentUser){

        openAuth();

        return;

    }


    const profile =
        currentProfile || {};


    openModal(`

        <button
            class="close-button"
            onclick="closeModal()">

            ×

        </button>

        <h2>
            Edit Profile
        </h2>


        <div
            style="
                text-align:center;
                margin-bottom:15px;
            ">

            <img
                id="editAvatar"
                class="big-avatar"
                src="${
                    profile.avatar_url
                    || DEFAULT_AVATAR
                }">


            <br>


            <button
                class="outline-button"
                style="margin-top:10px"
                onclick="
                    document
                    .getElementById('avatarFile')
                    .click()
                ">

                🖼️ Upload Profile Picture

            </button>


            <input
                id="avatarFile"
                class="hidden"
                type="file"
                accept="image/*"
                onchange="previewAvatar(event)">

        </div>


        <input
            id="profileName"
            class="input"
            placeholder="Display name"
            value="${
                escapeHTML(
                    profile.display_name
                )
            }">


        <input
            id="profileUsername"
            class="input"
            placeholder="Username"
            value="${
                escapeHTML(
                    profile.username
                )
            }">


        <textarea
            id="profileBio"
            class="input"
            rows="3"
            placeholder="Bio">${
                escapeHTML(
                    profile.bio
                )
            }</textarea>


        <div
            id="profileMessage"
            class="message">
        </div>


        <button
            class="primary-button"
            style="width:100%"
            onclick="saveProfile()">

            Save Profile

        </button>


        <button
            class="outline-button"
            style="
                width:100%;
                margin-top:9px;
            "
            onclick="logout()">

            Log Out

        </button>

    `);

}


function previewAvatar(event){

    const file =
        event.target.files[0];

    if(!file)return;


    selectedAvatarFile =
        file;


    document
        .getElementById("editAvatar")
        .src =
        URL.createObjectURL(file);

}


/* =====================================================
   SAVE PROFILE
===================================================== */

async function saveProfile(){

    const message =
        document.getElementById(
            "profileMessage"
        );


    let avatarURL =
        currentProfile?.avatar_url
        || null;


    if(selectedAvatarFile){

        const extension =
            selectedAvatarFile.name
            .split(".")
            .pop()
            .toLowerCase();


        const path =
            currentUser.id +
            "/avatar." +
            extension;


        const upload =
            await supabaseClient
            .storage
            .from("avatars")
            .upload(
                path,
                selectedAvatarFile,
                {
                    upsert:true,
                    contentType:
                        selectedAvatarFile.type
                }
            );


        if(upload.error){

            message.textContent =
                upload.error.message;

            return;

        }


        const publicURL =
            supabaseClient
            .storage
            .from("avatars")
            .getPublicUrl(path);


        avatarURL =
            publicURL.data.publicUrl;

    }


    const name =
        document
        .getElementById("profileName")
        .value
        .trim();


    const username =
        document
        .getElementById("profileUsername")
        .value
        .trim()
        .replace(/^@/,"");


    const bio =
        document
        .getElementById("profileBio")
        .value
        .trim();


    const result =
        await supabaseClient
        .from("profiles")
        .upsert({

            id:currentUser.id,

            display_name:name,

            username:username,

            bio:bio,

            avatar_url:avatarURL

        });


    if(result.error){

        message.textContent =
            result.error.message;

        return;

    }


    message.textContent =
        "Profile saved! 🎉";


    selectedAvatarFile =
        null;


    await loadProfile();


    setTimeout(
        closeModal,
        700
    );

}


/* =====================================================
   POSTS
===================================================== */

async function createPost(){

    if(!currentUser){

        openAuth();

        return;

    }


    const input =
        document.getElementById(
            "postInput"
        );


    const content =
        input.value.trim();


    if(!content){

        showMessage(
            "Isulat muna ang post."
        );

        return;

    }


    const result =
        await supabaseClient
        .from("posts")
        .insert({

            user_id:
                currentUser.id,

            content:
                content

        });


    if(result.error){

        showMessage(
            result.error.message
        );

        return;

    }


    input.value = "";


    await loadFeed();

}


async function loadFeed(){

    if(!supabaseClient){

        showDemoFeed();

        return;

    }


    const result =
        await supabaseClient
        .from("posts")
        .select(`
            id,
            content,
            image_url,
            created_at,
            profiles(
                display_name,
                username,
                avatar_url
            )
        `)
        .order(
            "created_at",
            {
                ascending:false
            }
        )
        .limit(30);


    if(
        result.error ||
        !result.data ||
        !result.data.length
    ){

        showDemoFeed();

        return;

    }


    const feed =
        document.getElementById(
            "feed"
        );


    feed.innerHTML =
        result.data
        .map(function(post){

            const profile =
                post.profiles || {};


            return `

                <article
                    class="card post">

                    <div
                        class="post-header">

                        <img
                            class="avatar"
                            src="${
                                profile.avatar_url
                                || DEFAULT_AVATAR
                            }">

                        <div>

                            <div
                                class="post-name">

                                ${
                                    escapeHTML(
                                        profile.display_name
                                        || "User"
                                    )
                                }

                            </div>

                            <div
                                class="post-meta">

                                ${
                                    new Date(
                                        post.created_at
                                    )
                                    .toLocaleString()
                                }

                                · 🌐

                            </div>

                        </div>

                        <button
                            class="more-button">

                            ⋮

                        </button>

                    </div>


                    <div
                        class="post-text">

                        ${
                            escapeHTML(
                                post.content
                            )
                        }

                    </div>


                    <div
                        class="post-actions">

                        <button
                            class="
                                action-button
                                nice
                            "
                            onclick="
                                toggleNice(this)
                            ">

                            <span
                                class="clover">

                                🍀

                            </span>

                            Nice

                        </button>


                        <button
                            class="action-button"
                            onclick="
                                showMessage(
                                    'Comments coming soon'
                                )
                            ">

                            💬 Comment

                        </button>


                        <button
                            class="action-button"
                            onclick="sharePost()">

                            ↗ Share

                        </button>

                    </div>

                </article>

            `;

        })
        .join("");

}


/* =====================================================
   PEOPLE / FOLLOW
===================================================== */

async function loadPeople(){

    const container =
        document.getElementById(
            "people"
        );


    if(!supabaseClient){

        container.innerHTML = `

            ${personHTML("James")}
            ${personHTML("Miguel")}
            ${personHTML("Ryan")}

        `;

        return;

    }


    const result =
        await supabaseClient
        .from("profiles")
        .select(`
            id,
            display_name,
            username,
            avatar_url
        `)
        .neq(
            "id",
            currentUser?.id
            || "00000000-0000-0000-0000-000000000000"
        )
        .limit(4);


    if(result.error){

        return;

    }


    container.innerHTML =
        result.data
        .map(function(person){

            return `

                <div class="person">

                    <img
                        src="${
                            person.avatar_url
                            || DEFAULT_AVATAR
                        }">

                    <div>

                        <b>
                            ${
                                escapeHTML(
                                    person.display_name
                                    || "User"
                                )
                            }
                        </b>

                        <div class="post-meta">

                            @${escapeHTML(
                                person.username
                                || "user"
                            )}

                        </div>

                    </div>


                    <button
                        class="
                            outline-button
                            follow-button
                        "
                        onclick="
                            toggleFollow(this)
                        ">

                        Follow

                    </button>

                </div>

            `;

        })
        .join("");

}


function personHTML(name){

    return `

        <div class="person">

            <img src="${DEFAULT_AVATAR}">

            <div>

                <b>${name}</b>

                <div class="post-meta">
                    @${name.toLowerCase()}
                </div>

            </div>

            <button
                class="
                    outline-button
                    follow-button
                "
                onclick="
                    toggleFollow(this)
                ">

                Follow

            </button>

        </div>

    `;

}


function toggleFollow(button){

    if(!currentUser){

        openAuth();

        return;

    }


    const following =
        button.textContent.trim()
        === "Following";


    if(following){

        button.textContent =
            "Follow";

        button.classList.remove(
            "following"
        );

    }else{

        button.textContent =
            "Following";

        button.classList.add(
            "following"
        );

    }

}


/* =====================================================
   SHARE
===================================================== */

async function sharePost(){

    if(
        navigator.share
    ){

        try{

            await navigator.share({

                title:
                    "Pride Connect",

                text:
                    "Check this post on Pride Connect."

            });

        }catch(error){}

    }else{

        showMessage(
            "Share is available on your phone."
        );

    }

}


/* =====================================================
   NAVIGATION
===================================================== */

function setNavigation(
    button,
    section
){

    document
        .querySelectorAll(
            ".nav-button"
        )
        .forEach(function(item){

            item.classList.remove(
                "active"
            );

        });


    button.classList.add(
        "active"
    );


    if(section !== "Home"){

        showMessage(
            section +
            " section is ready for the next module."
        );

    }

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

    await supabaseClient
        .auth
        .signOut();


    currentUser =
        null;

    currentProfile =
        null;


    closeModal();


    document
        .getElementById("sideName")
        .textContent =
        "Guest";


    document
        .getElementById("sideUsername")
        .textContent =
        "@guest";


    document
        .getElementById("sideBio")
        .textContent =
        "Be yourself, everyone else is already taken.";


    setImage(
        "sideAvatar",
        null
    );


    setImage(
        "composerAvatar",
        null
    );


    await loadFeed();

}


/* =====================================================
   APP LOADING
===================================================== */

async function loadApp(){

    if(!supabaseClient){

        showDemoFeed();

        loadPeople();

        return;

    }


    const session =
        await supabaseClient
        .auth
        .getSession();


    currentUser =
        session
        .data
        .session
        ?.user
        || null;


    if(currentUser){

        await loadProfile();

        await loadFeed();

        await loadPeople();

    }else{

        showDemoFeed();

        loadPeople();

    }

}


/* =====================================================
   AUTH STATE
===================================================== */

if(supabaseClient){

    supabaseClient
        .auth
        .onAuthStateChange(
            async function(){

                await loadApp();

            }
        );

}


/* =====================================================
   START APP
===================================================== */

setImage(
    "sideAvatar",
    null
);

setImage(
    "composerAvatar",
    null
);


loadApp();

</script>

</body>
</html>
